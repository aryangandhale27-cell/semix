<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <defs>
    <!-- Core gradient for center of microchip -->
    <linearGradient id="semixWhiteCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Vibrant Gradient for Letter X on dark background -->
    <linearGradient id="semixWhiteXGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
  </defs>

  <!-- ================= MICROCHIP SYMBOL ================= -->
  <!-- Chip Pin Leads (Short Stubs) -->
  <g stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="butt">
    <!-- Top Pins -->
    <line x1="48" y1="39" x2="48" y2="33" />
    <line x1="64" y1="39" x2="64" y2="33" />
    <line x1="86" y1="39" x2="86" y2="33" />
    <line x1="102" y1="39" x2="102" y2="33" />

    <!-- Bottom Pins -->
    <line x1="48" y1="111" x2="48" y2="117" />
    <line x1="64" y1="111" x2="64" y2="117" />
    <line x1="86" y1="111" x2="86" y2="117" />
    <line x1="102" y1="111" x2="102" y2="117" />

    <!-- Left Pins -->
    <line x1="39" y1="48" x2="33" y2="48" />
    <line x1="39" y1="64" x2="33" y2="64" />
    <line x1="39" y1="86" x2="33" y2="86" />
    <line x1="39" y1="102" x2="33" y2="102" />

    <!-- Right Pins -->
    <line x1="111" y1="48" x2="117" y2="48" />
    <line x1="111" y1="64" x2="117" y2="64" />
    <line x1="111" y1="86" x2="117" y2="86" />
    <line x1="111" y1="102" x2="117" y2="102" />
  </g>

  <!-- Traces with Round Pads -->
  <g stroke="#E2E8F0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Traces -->
    <path d="M 56 39 L 56 28 L 38 28 L 38 14" />
    <circle cx="38" cy="14" r="3.8" fill="#E2E8F0" stroke="none" />

    <path d="M 71 39 L 71 18" />
    <circle cx="71" cy="18" r="3.8" fill="#E2E8F0" stroke="none" />

    <path d="M 79 39 L 79 18" />
    <circle cx="79" cy="18" r="3.8" fill="#E2E8F0" stroke="none" />

    <path d="M 94 39 L 94 28 L 112 28 L 112 14" />
    <circle cx="112" cy="14" r="3.8" fill="#E2E8F0" stroke="none" />

    <!-- Bottom Traces -->
    <path d="M 56 111 L 56 122 L 38 122 L 38 136" />
    <circle cx="38" cy="136" r="3.8" fill="#E2E8F0" stroke="none" />

    <path d="M 71 111 L 71 132" />
    <circle cx="71" cy="132" r="3.8" fill="#E2E8F0" stroke="none" />

    <path d="M 79 111 L 79 132" />
    <circle cx="79" cy="132" r="3.8" fill="#E2E8F0" stroke="none" />

    <path d="M 94 111 L 94 122 L 112 122 L 112 136" />
    <circle cx="112" cy="136" r="3.8" fill="#E2E8F0" stroke="none" />

    <!-- Left Traces -->
    <path d="M 39 56 L 28 56 L 28 38 L 14 38" />
    <circle cx="14" cy="38" r="3.8" fill="#E2E8F0" stroke="none" />

    <path d="M 39 71 L 18 71" />
    <circle cx="18" cy="71" r="3.8" fill="#E2E8F0" stroke="none" />

    <path d="M 39 79 L 18 79" />
    <circle cx="18" cy="79" r="3.8" fill="#E2E8F0" stroke="none" />

    <path d="M 39 94 L 28 94 L 28 112 L 14 112" />
    <circle cx="14" cy="112" r="3.8" fill="#E2E8F0" stroke="none" />

    <!-- Right Traces -->
    <path d="M 111 56 L 122 56 L 122 38 L 136 38" />
    <circle cx="136" cy="38" r="3.8" fill="#E2E8F0" stroke="none" />

    <path d="M 111 71 L 132 71" />
    <circle cx="132" cy="71" r="3.8" fill="#E2E8F0" stroke="none" />

    <path d="M 111 79 L 132 79" />
    <circle cx="132" cy="79" r="3.8" fill="#E2E8F0" stroke="none" />

    <path d="M 111 94 L 122 94 L 122 112 L 136 112" />
    <circle cx="136" cy="112" r="3.8" fill="#E2E8F0" stroke="none" />
  </g>

  <!-- Main Chip Body -->
  <rect x="39" y="39" width="72" height="72" rx="13" ry="13" fill="#6B21A8" />

  <!-- 4 Corner Screws -->
  <!-- Top-Left -->
  <circle cx="51" cy="51" r="4.2" fill="#FFFFFF" />
  <path d="M 49 51 L 53 51 M 51 49 L 51 53" stroke="#6B21A8" stroke-width="1.2" stroke-linecap="round" />

  <!-- Top-Right -->
  <circle cx="99" cy="51" r="4.2" fill="#FFFFFF" />
  <path d="M 97 51 L 101 51 M 99 49 L 99 53" stroke="#6B21A8" stroke-width="1.2" stroke-linecap="round" />

  <!-- Bottom-Left -->
  <circle cx="51" cy="99" r="4.2" fill="#FFFFFF" />
  <path d="M 49 99 L 53 99 M 51 97 L 51 101" stroke="#6B21A8" stroke-width="1.2" stroke-linecap="round" />

  <!-- Bottom-Right -->
  <circle cx="99" cy="99" r="4.2" fill="#FFFFFF" />
  <path d="M 97 99 L 101 99 M 99 97 L 99 101" stroke="#6B21A8" stroke-width="1.2" stroke-linecap="round" />

  <!-- Center Glowing Core -->
  <rect x="58" y="58" width="34" height="34" rx="7" ry="7" fill="url(#semixWhiteCoreGrad)" />

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- "SEMI" -->
  <text 
    x="162" 
    y="105" 
    fill="#FFFFFF" 
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="76" 
    letter-spacing="-1px"
  >SEMI</text>

  <!-- "X" with rounded-pill ends and radiant violet-magenta gradient -->
  <g stroke="url(#semixWhiteXGrad)" stroke-width="15.5" stroke-linecap="round">
    <line x1="384" y1="46" x2="438" y2="105" />
    <line x1="384" y1="105" x2="438" y2="46" />
  </g>

  <!-- Registered Trademark Symbol "®" -->
  <g transform="translate(452, 43)">
    <circle cx="5" cy="5" r="5" fill="none" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="5" y="7.2" fill="#E2E8F0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="6.5" font-weight="800" text-anchor="middle">R</text>
  </g>

  <!-- "LABS" Subtitle -->
  <text 
    x="320" 
    y="134" 
    fill="#E2E8F0" 
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
    font-weight="800" 
    font-size="19" 
    letter-spacing="9px"
  >LABS</text>
</svg>
